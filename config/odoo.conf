[options]
; Parametres de connexion a la base. Les presents ici plutot qu'en variables
; d'environnement : les variables HOST/USER/PASSWORD de l'image ne sont lues
; que par son entrypoint, donc pas par un `docker compose exec odoo odoo ...`.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Addons du core Odoo (image) + ce depot, monte en /mnt/extra-addons.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Environnement de developpement uniquement.
admin_passwd = admin
