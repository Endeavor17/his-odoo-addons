# Environnement de developpement/recette. Odoo est fourni par l'image
# officielle : ce depot ne contient QUE les modules custom du Groupe.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 10

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      # Evite de semer des __pycache__ dans le depot monte
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # Ce depot est monte comme repertoire d'addons supplementaires.
      # /mnt/extra-addons fait deja partie de l'addons_path de l'image.
      - ./:/mnt/extra-addons
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
