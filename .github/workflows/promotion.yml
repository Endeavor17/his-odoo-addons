# Promotion en production : pousser un tag vAAAA.MM.JJ sur un commit de main
# deja teste en staging. On ne reconstruit RIEN : le tag designe exactement
# l'image deja construite par ci.yml pour ce commit (meme digest). Si elle
# n'existe pas (commit hors main, ou CI rouge), la promotion echoue.
# La prod ne bouge que quand on y change IMAGE_TAG a la main.
name: Promotion

on:
  push:
    tags: ["v*"]

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Etiqueter l'image testee
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/endeavor17/his-odoo:${GITHUB_REF_NAME}" \
            "ghcr.io/endeavor17/his-odoo:sha-${GITHUB_SHA}"
