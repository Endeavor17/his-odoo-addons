# Outillage qualite du depot. Odoo fournit le runtime ; ce fichier ne configure
# que le lint et le formatage des modules custom du Groupe.
[tool.ruff]
target-version = "py311"
line-length = 120
# Module tiers (OCA) : il n'est pas juge par notre politique.
extend-exclude = ["web_responsive"]

[tool.ruff.lint]
# Regles retenues : erreurs (E,F,W), bugs probables (B), complexite (C90),
# tri des imports (I), modernisation (UP), simplifications (SIM), securite (S)
# et les regles Ruff (RUF). Les faux positifs propres a Odoo sont neutralises
# par fichier ci-dessous, jamais en desactivant la regle partout.
select = ["E", "F", "W", "B", "C90", "I", "UP", "SIM", "S", "RUF"]
ignore = [
    "E501",     # longueur de ligne : geree par le formateur, pas bloquante
    "SIM103",   # "return bool(x)" explicite : souvent plus lisible chez Odoo
    # Les chaines traduites d'Odoo utilisent le formatage %-/positionnel :
    # les passer en f-string casserait l'extraction de traduction (_()).
    "UP031",    # printf-string-formatting
    # Les modeles Odoo portent des constantes de classe (dict/list de mapping) ;
    # exiger typing.ClassVar partout serait du bruit sans valeur.
    "RUF012",   # mutable-class-default
    # Texte francais accentue et arabe : les caracteres "ambigus" sont voulus.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Les manifestes Odoo SONT un dict nu evalue par le framework.
"**/__manifest__.py" = ["B018"]
# Odoo importe les sous-modules pour leurs effets de bord.
"**/__init__.py" = ["F401"]
# Scripts lances dans `odoo shell` : `env` est injecte, print est la sortie.
"tools/**" = ["F821", "T201", "S101", "E402"]
"**/docs/**" = ["F821", "T201", "S101"]
"**/migrations/**" = ["F821"]
# Les tests utilisent assert (c'est leur role) et des noms de fixture varies.
"**/tests/**" = ["S101", "B017"]
# Idiome Odoo : Model = self.env['x'], variables locales en Capitale.
"**/models/**" = ["N806", "N803"]
"**/wizard/**" = ["N806", "N803"]

[tool.ruff.lint.mccabe]
max-complexity = 15
