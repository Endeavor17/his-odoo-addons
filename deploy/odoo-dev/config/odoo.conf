[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# Mot de passe maitre, stocke HACHE (pbkdf2-sha512) et non en clair.
#
# Ce fichier est monte tel quel depuis le depot par docker-compose : ce qui est
# commite EST la configuration de production. Une valeur en clair ici est donc
# publiee sur un depot public, et elle ouvre /web/database/backup, /restore et
# /drop sur odoo.his.edu.dz — soit le telechargement ou la destruction de la
# base entiere.
#
# Odoo accepte un hachage a cet emplacement : c'est exactement ce qu'il ecrit
# lui-meme quand on change le mot de passe maitre depuis son interface.
#
# Ne jamais supprimer cette ligne : sans admin_passwd, Odoo retombe sur son
# defaut « admin », ce qui est pire que la valeur en clair qu'on remplace ici.
#
# Pour le changer :
#   python -c "from passlib.context import CryptContext; print(CryptContext(['pbkdf2_sha512']).hash('LE-NOUVEAU'))"
admin_passwd = $pbkdf2-sha512$25000$KGUMYezdmxPinNP6HwMghA$TBu5BArC.nMGsBsPCQXxKgW7eJYH1maezd1dFsVMTSMWw1zNk7GGGTsErimRzd9QZWGkSsx3EpRoOhqLJDyBWA

list_db = False
proxy_mode = True
dbfilter = ^his_dev$

# Limites (audit S-8). Sans `workers`, Odoo 19 les applique quand meme
# (ThreadedServer.process_limit) : une requete ou un cron au-dela de
# limit_time_real fait redemarrer proprement le serveur. 120 est le defaut,
# ecrit ici pour qu'il se lise.
limit_time_real = 120
#
# PAS de `workers` : le websocket passerait sur le port 8072 (gevent_port), et
# il faudrait une route Traefik dediee dans Dokploy. Sans elle, le temps reel
# du POS et de Discuss casse.
#
# limit_memory_soft (defaut 2 Gio) depasse les 1,5 G du conteneur : au-dela,
# le noyau tue le processus avant qu'Odoo ne redemarre proprement. Odoo mesure
# la memoire VIRTUELLE (VmSize), pas la resident, donc ne la regler qu'apres
# l'avoir mesuree en prod, sinon boucle de redemarrages :
#   docker exec <conteneur>-odoo-1 grep VmSize /proc/1/status
# puis une valeur en octets au-dessus du pic observe et sous 1,5 G, par ex.
#   limit_memory_soft = 1288490188
